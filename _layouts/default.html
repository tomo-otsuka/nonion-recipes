<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }} | {{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Recipes</a>
        <a href="{{ '/substitutions/' | relative_url }}">Substitutions</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% if page.url != '/' and page.url != '/index.html' %}
    <nav class="breadcrumbs">
      <a href="{{ '/' | relative_url }}">Home</a> / 
      <span>{{ page.title }}</span>
    </nav>
    {% endif %}

    <div class="page-content">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ site.time | date: "%Y" }} Nonion Recipes. Built with ♥️.</p>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Add interactive checkboxes to ingredient lists
      const ingredientLists = document.querySelectorAll(".ingredients-section ul");
      ingredientLists.forEach(ul => {
        ul.classList.add("ingredient-list");
        ul.querySelectorAll("li").forEach(li => {
          // Store original HTML for scaling
          li.dataset.originalHtml = li.innerHTML;
          li.addEventListener("click", () => {
            li.classList.toggle("checked");
          });
        });
      });

      // Add elegant counters to instruction lists (all ordered lists in content)
      const instructionLists = document.querySelectorAll(".page-content ol");
      instructionLists.forEach(ol => {
        ol.classList.add("instruction-list");
      });

      // --- Recipe Scaler Logic ---
      const yieldBadge = Array.from(document.querySelectorAll('.badge')).find(b => 
        b.querySelector('.badge-label') && b.querySelector('.badge-label').textContent.trim().toLowerCase() === 'yield'
      );

      if (yieldBadge) {
        const badgeValueEl = yieldBadge.querySelector('.badge-value');
        if (badgeValueEl) {
          const originalText = badgeValueEl.textContent.trim();
          const match = originalText.match(/(\d+)/);
          
          if (match) {
            const baseServings = parseInt(match[1], 10);
            let currentServings = baseServings;

            // Determine suffix (e.g. "servings")
            let suffix = 'servings';
            const words = originalText.split(/\s+/);
            const lastWord = words[words.length - 1];
            if (lastWord && !/\d/.test(lastWord)) {
              suffix = lastWord;
            }

            // Update DOM to include scaler
            badgeValueEl.style.display = 'none'; // hide original text
            
            const scalerDiv = document.createElement('div');
            scalerDiv.className = 'servings-scaler';
            scalerDiv.innerHTML = `
              <button class="scaler-btn minus" aria-label="Decrease servings">-</button>
              <span class="scaler-value">${currentServings}</span>
              <button class="scaler-btn plus" aria-label="Increase servings">+</button>
            `;
            
            const servingsText = document.createElement('span');
            servingsText.style.fontSize = '0.9rem';
            servingsText.style.color = 'var(--text-color)';
            servingsText.style.fontWeight = '500';
            servingsText.style.marginTop = '0.2rem';
            servingsText.style.display = 'block';
            servingsText.textContent = suffix;

            // Insert new UI into the badge
            yieldBadge.appendChild(scalerDiv);
            yieldBadge.appendChild(servingsText);

            const minusBtn = scalerDiv.querySelector('.minus');
            const plusBtn = scalerDiv.querySelector('.plus');
            const valueSpan = scalerDiv.querySelector('.scaler-value');

            const parseFraction = (str) => {
              const charMap = {'¼': 0.25, '½': 0.5, '¾': 0.75, '⅓': 0.333, '⅔': 0.666, '⅛': 0.125, '⅜': 0.375, '⅝': 0.625, '⅞': 0.875};
              if (charMap[str]) return charMap[str];
              if (str.includes('/')) {
                const parts = str.split('/');
                if (parts.length === 2) return parseInt(parts[0], 10) / parseInt(parts[1], 10);
              }
              return parseFloat(str);
            };

            const formatFraction = (num) => {
              if (Math.abs(Math.round(num) - num) < 0.05) return Math.round(num).toString();
              
              const fractions = [
                { val: 0.25, str: '¼' }, { val: 0.5, str: '½' }, { val: 0.75, str: '¾' },
                { val: 0.333, str: '⅓' }, { val: 0.666, str: '⅔' },
                { val: 0.125, str: '⅛' }, { val: 0.375, str: '⅜' },
                { val: 0.625, str: '⅝' }, { val: 0.875, str: '⅞' }
              ];
              
              let whole = Math.floor(num);
              let remainder = num - whole;
              let closestFrac = null;
              let minDiff = 0.04; 
              
              for (let f of fractions) {
                if (Math.abs(remainder - f.val) < minDiff) {
                  closestFrac = f.str;
                  minDiff = Math.abs(remainder - f.val);
                }
              }

              if (closestFrac) {
                return whole > 0 ? `${whole} ${closestFrac}` : closestFrac;
              }
              
              return Number.isInteger(num) ? num.toString() : num.toFixed(1).replace(/\.0$/, '');
            };

            const convertUnit = (val, unitStr) => {
              const u = unitStr.toLowerCase();
              if (['tsp', 'teaspoon', 'teaspoons'].includes(u)) {
                if (val >= 48 * 4) return { val: val / 192, unit: val / 192 <= 1 ? 'quart' : 'quarts' };
                if (val >= 12) {
                  const cups = val / 48;
                  const commonCups = [0.25, 0.333, 0.5, 0.666, 0.75];
                  let isCommon = Number.isInteger(cups);
                  if (!isCommon) {
                    for (let c of commonCups) if (Math.abs((cups - Math.floor(cups)) - c) < 0.05) isCommon = true;
                  }
                  if (isCommon) return { val: cups, unit: cups <= 1 ? 'cup' : 'cups' };
                }
                if (val >= 3) return { val: val / 3, unit: val / 3 <= 1 ? 'tbsp' : 'tbsp' };
                return { val, unit: val <= 1 ? 'tsp' : 'tsp' };
              }
              if (['tbsp', 'tablespoon', 'tablespoons', 'tbs'].includes(u)) {
                const tspVal = val * 3;
                if (tspVal < 3) return { val: tspVal, unit: tspVal <= 1 ? 'tsp' : 'tsp' };
                if (tspVal >= 48 * 4) return { val: tspVal / 192, unit: tspVal / 192 <= 1 ? 'quart' : 'quarts' };
                if (tspVal >= 12) {
                  const cups = tspVal / 48;
                  const commonCups = [0.25, 0.333, 0.5, 0.666, 0.75];
                  let isCommon = Number.isInteger(cups);
                  if (!isCommon) {
                    for (let c of commonCups) if (Math.abs((cups - Math.floor(cups)) - c) < 0.05) isCommon = true;
                  }
                  if (isCommon) return { val: cups, unit: cups <= 1 ? 'cup' : 'cups' };
                }
                return { val, unit: val <= 1 ? 'tbsp' : 'tbsp' };
              }
              if (['cup', 'cups', 'c'].includes(u)) {
                const tspVal = val * 48;
                if (tspVal < 12) {
                  if (tspVal >= 3) return { val: tspVal / 3, unit: tspVal / 3 <= 1 ? 'tbsp' : 'tbsp' };
                  return { val: tspVal, unit: tspVal <= 1 ? 'tsp' : 'tsp' };
                }
                if (tspVal >= 48 * 4) return { val: tspVal / 192, unit: tspVal / 192 <= 1 ? 'quart' : 'quarts' };
                return { val, unit: val <= 1 ? 'cup' : 'cups' };
              }
              if (['oz', 'ounce', 'ounces'].includes(u)) {
                if (val >= 16) {
                  const lbs = val / 16;
                  if (Number.isInteger(lbs) || Math.abs(lbs - Math.floor(lbs)) === 0.5 || Math.abs(lbs - Math.floor(lbs)) === 0.25) {
                    return { val: lbs, unit: lbs <= 1 ? 'lb' : 'lbs' };
                  }
                }
                return { val, unit: val <= 1 ? 'oz' : 'oz' };
              }
              if (['lb', 'lbs', 'pound', 'pounds'].includes(u)) {
                if (val < 1) return { val: val * 16, unit: 'oz' };
                return { val, unit: val <= 1 ? 'lb' : 'lbs' };
              }
              if (['g', 'gram', 'grams'].includes(u)) {
                if (val >= 1000) return { val: val / 1000, unit: 'kg' };
                return { val, unit: 'g' };
              }
              if (['kg', 'kilogram', 'kilograms'].includes(u)) {
                if (val < 1) return { val: val * 1000, unit: 'g' };
                return { val, unit: 'kg' };
              }
              if (['ml', 'milliliter', 'milliliters'].includes(u)) {
                if (val >= 1000) return { val: val / 1000, unit: 'L' };
                return { val, unit: 'ml' };
              }
              if (['l', 'liter', 'liters'].includes(u)) {
                if (val < 1) return { val: val * 1000, unit: 'ml' };
                return { val, unit: 'L' };
              }
              return { val, unit: unitStr };
            };

            const updateIngredients = () => {
              const scale = currentServings / baseServings;
              
              document.querySelectorAll(".ingredient-list li").forEach(li => {
                let html = li.dataset.originalHtml;
                const regex = /^(\s*~?\s*)([\d\s\/\.\-\–\—\¼\½\¾\⅓\⅔\⅛\⅜\⅝\⅞]+)(.*)$/;
                const match = html.match(regex);
                
                if (match) {
                  const prefix = match[1];
                  const numStr = match[2].trim();
                  let rest = match[3];

                  let newNumStr = "";
                  
                  if (numStr.match(/[\-\–\—]/)) {
                    // Range like "2 - 3"
                    const parts = numStr.split(/[\-\–\—]/).map(s => s.trim());
                    if (parts.length === 2) {
                       let p1 = parseFraction(parts[0]);
                       let p2 = parseFraction(parts[1]);
                       if (!isNaN(p1) && !isNaN(p2)) {
                         newNumStr = formatFraction(p1 * scale) + " - " + formatFraction(p2 * scale);
                       }
                    }
                  } else {
                     let parts = numStr.split(/\s+/).filter(Boolean);
                     let totalVal = 0;
                     let valid = true;
                     for (let p of parts) {
                        let val = parseFraction(p);
                        if (isNaN(val)) { valid = false; break; }
                        totalVal += val;
                     }
                     if (valid && totalVal > 0) {
                        let scaledVal = totalVal * scale;
                        
                        // Attempt unit conversion
                        const unitMatch = rest.match(/^\s*([a-zA-Z]+)(.*)$/);
                        if (unitMatch) {
                          let potentialUnit = unitMatch[1];
                          let unitRest = unitMatch[2];
                          
                          let converted = convertUnit(scaledVal, potentialUnit);
                          if (converted.unit.toLowerCase() !== potentialUnit.toLowerCase() || converted.val !== scaledVal) {
                             newNumStr = formatFraction(converted.val);
                             let spacing = rest.match(/^\s*/)[0];
                             if (!spacing) spacing = ' ';
                             rest = spacing + converted.unit + unitRest;
                          } else {
                             newNumStr = formatFraction(scaledVal);
                          }
                        } else {
                          newNumStr = formatFraction(scaledVal);
                        }
                     }
                  }

                  if (newNumStr) {
                    if (rest && rest[0].match(/[a-zA-Z]/)) {
                      rest = " " + rest.trimLeft();
                    }
                    const reconstructed = prefix + newNumStr + (rest.startsWith(' ') ? rest : (rest.startsWith('-') ? rest : ' ' + rest));
                    li.innerHTML = reconstructed;
                  }
                }
              });
            };

            minusBtn.addEventListener('click', () => {
              if (currentServings > 1) {
                currentServings--;
                valueSpan.textContent = currentServings;
                updateIngredients();
              }
            });

            plusBtn.addEventListener('click', () => {
              currentServings++;
              valueSpan.textContent = currentServings;
              updateIngredients();
            });
          }
        }
      }
    });
  </script>
</body>
</html>
